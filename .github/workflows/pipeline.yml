name: Data Pipeline

on:
  schedule:
    - cron: '30 12 5 * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ✅ updated

      - name: Set up Python
        uses: actions/setup-python@v5   # ✅ updated
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/report.py

      - name: Upload report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/report_*.csv
          name: report_json
          path: output/report_*.json
          name: report_parquet
          path: output/report_*.parquet
          name: pipeline_log
          path: output/pipeline.log
      
      - name: Failure notification
        if: failure()
        run: echo "Pipeline failed! Please check the logs for details."
